services:
  # External Traefik - only exposes /api -> gateway
  bfi-dev-traefik-external:
    image: traefik:v2.10
    container_name: bfi-dev-traefik-external
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`traefik.instance`, `external`)"
      - "--entrypoints.web.address=:${TRAEFIK_EXTERNAL_CONTAINER_PORT}"
    ports:
      - "${TRAEFIK_EXTERNAL_HOST_PORT}:${TRAEFIK_EXTERNAL_CONTAINER_PORT}"
      - "${TRAEFIK_EXTERNAL_HOST_UI_PORT}:${TRAEFIK_EXTERNAL_CONTAINER_UI_PORT}"
    networks:
      - bfi-dev-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "traefik.enable=true"
      - "traefik.instance=external"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--accesslog=true"



  # Internal Traefik - handles internal service load balancing
  bfi-dev-traefik-internal:
    image: traefik:v2.10
    container_name: bfi-dev-traefik-internal
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`traefik.instance`, `internal`)"
      - "--entrypoints.web.address=:${TRAEFIK_INTENAL_CONTAINER_PORT}"
    networks:
      - bfi-dev-net
    depends_on:
      - bfi-dev-service-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${TRAEFIK_INTERNAL_HOST_UI_PORT}:${TRAEFIK_INTERNAL_CONTAINER_UI_PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.instance=internal"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--accesslog=true"



  # Gateway Service
  bfi-dev-service-gateway:
    build:
      context: ../bfi-service-gateway
    image: bfi-dev-service-gateway
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
    networks:
      - bfi-dev-net
    volumes:
      - ../bfi-service-gateway:/app
      - /var/run/docker.sock:/var/run/docker.sock
      - /app/node_modules
      - ../bfi-shared:/app/shared
    ports:
      - "${HOST_PORT_GATEWAY}:${PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.instance=external"
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api`)"
      - "traefik.http.services.gateway.loadbalancer.server.port=${PORT}"


networks:
  bfi-dev-net:
    driver: bridge